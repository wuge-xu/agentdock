services:
  postgres:
    image: postgres:16-alpine
    container_name: agentdock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentdock
      POSTGRES_USER: agentdock
      POSTGRES_PASSWORD: agentdock
    ports:
      - "5432:5432"
    volumes:
      - agentdock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agentdock -d agentdock
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  agentdock_postgres_data: